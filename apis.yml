name: Sana
kind: company
description: Sana is an AI-native knowledge and learning company (Stockholm, Sweden;
  now part of Workday) behind Sana AI / Sana Agents and the Sana Learn platform. It
  builds expert AI agents and assistants grounded in a company's knowledge, plus an
  AI-first LMS/LXP. Sana exposes a tenant-scoped REST API (OAuth 2.0 client
  credentials) for user, group, program, course, content, and reporting management,
  along with xAPI and SCIM integration surfaces.
