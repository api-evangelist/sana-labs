description: >-
  FinOps view of Sana spend. Sana is sold through enterprise, sales-led
  agreements (Sana Learn licensed per seat with a stated minimum of around 300
  users; Sana AI / Sana Agents quoted by sales) rather than self-serve, usage-
  metered API pricing. As a result, cost is governed primarily by negotiated
  seat/contract commitments. No public per-call or per-token API meters are
  documented; meters below are illustrative cost dimensions, not reconciled rates.
notes: >-
  Replace illustrative dimensions with the customer's actual contracted line
  items during reconciliation. Verify seat counts, term, and any usage-based
  add-ons with Sana.
