  - product
principles:
- name: Visibility
  description: Track contracted seats and product lines against actual active users and adoption.
- name: Allocation
  description: Map Sana Learn seats and Sana AI/Agents usage to teams/cost centers via groups and teamspaces.
- name: Optimization
  description: Right-size seat counts at renewal; consolidate internal/external learners under the minimum where possible.
- name: Accountability
  description: Assign owners per teamspace/program; review adoption and renewal terms against budget.
