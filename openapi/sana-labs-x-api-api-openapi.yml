openapi: 3.2.0
info:
  title: Sana X API
  description: Tenant-scoped REST API for the Sana platform (Sana AI / Sana Agents and Sana Learn).
  termsOfService: https://sanalabs.com/legal
  contact:
    name: Sana
    url: https://docs.sana.ai/api-docs/
  version: '0.0'
servers:
- url: https://<domain>.sana.ai
  description: Tenant-scoped base URL; replace <domain> with your Sana tenant.
security:
- bearerAuth: []
tags:
- name: x API
paths:
  /api/oauth/token:
    post:
      operationId: createXapiToken
      tags:
      - x API
      summary: OAuth token endpoint for xAPI
      description: Dedicated OAuth token endpoint used to authenticate xAPI statement requests.
      security: []
      responses:
        '200':
          description: OK
  /xapi/v1/statements:
    post:
      operationId: sendXapiStatements
      tags:
      - x API
      summary: Send xAPI (Experience API) statements
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer access token obtained from POST /api/token via the OAuth 2.0 client credentials flow. Sent as: Authorization: Bearer <accessToken>.'
