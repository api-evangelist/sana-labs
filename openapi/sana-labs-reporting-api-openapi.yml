openapi: 3.2.0
info:
  title: Sana Reporting API
  description: Tenant-scoped REST API for the Sana platform (Sana AI / Sana Agents and Sana Learn).
  termsOfService: https://sanalabs.com/legal
  contact:
    name: Sana
    url: https://docs.sana.ai/api-docs/
  version: '0.0'
servers:
- url: https://<domain>.sana.ai
  description: Tenant-scoped base URL; replace <domain> with your Sana tenant.
security:
- bearerAuth: []
tags:
- name: Reporting
paths:
  /api/v0/reports:
    get:
      operationId: listReports
      tags:
      - Reporting
      summary: List available reports (legacy reporting)
      responses:
        '200':
          description: OK
  /api/v0/reports/{reportId}/jobs:
    parameters:
    - name: reportId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getReportJobs
      tags:
      - Reporting
      summary: Get report job status (legacy reporting)
      responses:
        '200':
          description: OK
    post:
      operationId: createReportJob
      tags:
      - Reporting
      summary: Create a report job (legacy reporting)
      responses:
        '200':
          description: OK
  /api/v0/reports/{reportId}/jobs/{jobId}:
    parameters:
    - name: reportId
      in: path
      required: true
      schema:
        type: string
    - name: jobId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getReportJob
      tags:
      - Reporting
      summary: Get a specific report job status (legacy reporting)
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer access token obtained from POST /api/token via the OAuth 2.0 client credentials flow. Sent as: Authorization: Bearer <accessToken>.'
