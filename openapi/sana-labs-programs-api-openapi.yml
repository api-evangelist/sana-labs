openapi: 3.2.0
info:
  title: Sana Programs API
  description: Tenant-scoped REST API for the Sana platform (Sana AI / Sana Agents and Sana Learn).
  termsOfService: https://sanalabs.com/legal
  contact:
    name: Sana
    url: https://docs.sana.ai/api-docs/
  version: '0.0'
servers:
- url: https://<domain>.sana.ai
  description: Tenant-scoped base URL; replace <domain> with your Sana tenant.
security:
- bearerAuth: []
tags:
- name: Programs
paths:
  /api/v0/programs:
    get:
      operationId: listPrograms
      tags:
      - Programs
      summary: List all programs
      responses:
        '200':
          description: OK
    post:
      operationId: createProgram
      tags:
      - Programs
      summary: Create a program
      responses:
        '200':
          description: OK
  /api/v0/programs/{programId}:
    parameters:
    - name: programId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getProgram
      tags:
      - Programs
      summary: Get a program
      responses:
        '200':
          description: OK
    patch:
      operationId: updateProgram
      tags:
      - Programs
      summary: Update a program
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteProgram
      tags:
      - Programs
      summary: Delete a program
      responses:
        '200':
          description: OK
  /api/v0/programs/{programId}/members:
    parameters:
    - name: programId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: enrollProgramMember
      tags:
      - Programs
      summary: Enroll a user to a program
      responses:
        '200':
          description: OK
    delete:
      operationId: unenrollProgramMember
      tags:
      - Programs
      summary: Unenroll a user from a program
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer access token obtained from POST /api/token via the OAuth 2.0 client credentials flow. Sent as: Authorization: Bearer <accessToken>.'
