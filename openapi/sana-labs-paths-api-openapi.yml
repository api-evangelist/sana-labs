openapi: 3.2.0
info:
  title: Sana Paths API
  description: Tenant-scoped REST API for the Sana platform (Sana AI / Sana Agents and Sana Learn).
  termsOfService: https://sanalabs.com/legal
  contact:
    name: Sana
    url: https://docs.sana.ai/api-docs/
  version: '0.0'
servers:
- url: https://<domain>.sana.ai
  description: Tenant-scoped base URL; replace <domain> with your Sana tenant.
security:
- bearerAuth: []
tags:
- name: Paths
paths:
  /api/v0/paths:
    get:
      operationId: listPaths
      tags:
      - Paths
      summary: List learning paths
      responses:
        '200':
          description: OK
  /api/v0/paths/{pathId}:
    parameters:
    - name: pathId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getPath
      tags:
      - Paths
      summary: Get a learning path
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer access token obtained from POST /api/token via the OAuth 2.0 client credentials flow. Sent as: Authorization: Bearer <accessToken>.'
